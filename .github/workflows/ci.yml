name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  genlayer-contract:
    name: GenLayer contract
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/genlayer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: packages/genlayer/requirements.txt
      - run: pip install -r requirements.txt
      - run: genvm-lint check contracts/assay_adjudicator.py
      - run: pytest tests/direct -v

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: foundry-rs/foundry-toolchain@v1
        with:
          version: stable
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Dependency and history security gates
        run: |
          npm audit --audit-level=moderate
          npm run security:secrets
      - name: Judged-artifact consistency and dead links
        run: |
          npm run check:judge
          git diff --exit-code -- apps/web/lib/standard.generated.ts apps/docs/content/docs/tools apps/docs/content/docs/case-studies apps/docs/content/docs/standard.mdx
      - run: npm run typecheck
      - run: npm test
      - name: Build the clean-checkout e2e stack
        run: |
          node packages/mcp-server/scripts/bundle.mjs
          npm run build --workspace @xyndicate/web
      - run: npm run test:e2e
      - run: forge test --root packages/contracts
